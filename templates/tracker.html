<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
</head>
<body>
    <h1>TRACKER</h1>
    <ul>
    {% for expense in items %}
        <li>{{expense[0]}} - {{expense[1]}}</li>
    {% endfor %}
    </ul>
    <h2>Total - {{total}}</h2>

    <form method="post">
        <input name="amount" type="number", step="0.01">
        <input name="category" type="text">
        <button>Add</button>
    </form>
</body>
</html>
